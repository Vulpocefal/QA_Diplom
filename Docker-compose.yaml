version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      retries: 5

  gate-simulator:
    build:
      context: .
      dockerfile: Dockerfile.gate-simulator
    ports:
      - "9999:9999"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  aqa-shop:
    image: eclipse-temurin:17-jdk
    container_name: aqa-shop
    working_dir: /app
    volumes:
      - ./aqa-shop.jar:/app/aqa-shop.jar
      - ./application.properties:/app/application.properties
    command: ["java", "-jar", "aqa-shop.jar", "--spring.config.location=file:/app/application.properties"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      gate-simulator:
        condition: service_started

volumes:
  pgdata:
